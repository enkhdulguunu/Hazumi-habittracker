<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAZUMI - Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Modak&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F4F7FC;
            --sidebar-bg: #FFFFFF;
            --primary-color: #6CD259; /* Matches your brand's signature green */
            --primary-hover: #59B847;
            --text-dark: #22252A;
            --text-muted: #8A92A6;
            --border-radius: 20px;
            --card-shadow: 0 8px 24px rgba(149, 157, 165, 0.1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }
        html,
        body {
            width: 100%;
            height: 100%;
        }
        body {
            min-width: 1180px;
            min-height: 620px;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            height: 100dvh;
            overflow-x: auto;
            overflow-y: hidden;
        }

 /* SIDEBAR  */
.hazumi-sidebar {
  width: 260px;
  height: calc(100dvh - 36px);
  min-height: 0;
  margin: 18px 0 18px 12px;
  padding: 18px 14px;
  flex: 0 0 260px;
  display: flex;
  flex-direction: column;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 43px;
  box-shadow:
    0 18px 45px rgba(66, 92, 57, 0.08),
    inset 0 1px 0 rgba(255, 255, 255, 0.85);
  overflow: hidden;
}
/* Brand */
.hazumi-brand {
  height: 88px;
  flex: 0 0 88px;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 8px;
  color: #000000;
  text-decoration: none;
}
.hazumi-brand img {
  width: 62px;
  height: 62px;
  flex-shrink: 0;
  object-fit: contain;
}
.hazumi-brand-title {
  margin-left: 1px;
  color: #000000;
  font-family: "Modak", system-ui;
  font-size: 23px;
  font-weight: 400;
  line-height: 1;
}
.hazumi-brand-subtitle {
  margin-top: 6px;
  margin-left: 1px;
  color: #000000;
  font-family: "Modak", system-ui;
  font-size: 13px;
  font-weight: 400;
  line-height: 1;
  white-space: nowrap;
}
/* Menu */
.hazumi-menu {
  min-height: 0;
  flex: 1;
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
}
.hazumi-menu::-webkit-scrollbar {
  display: none;
}
.hazumi-menu-item {
  position: relative;
  width: 232px;
  height: 58px;
  min-height: 58px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 13px;
  color: #111111;
  text-decoration: none;
  border-radius: 17px;
  overflow: hidden;
  transition:
    background 0.22s ease,
    transform 0.22s ease,
    box-shadow 0.22s ease;
}
.hazumi-menu-item::before {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  width: 4px;
  height: 0;
  background: #78dc54;
  border-radius: 999px;
  transform: translateY(-50%);
  transition: height 0.22s ease;
}
.hazumi-menu-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border-radius: 15px;
  transition:
    background 0.22s ease,
    transform 0.22s ease;
}
.hazumi-menu-icon img {
  width: 32px;
  height: 32px;
  display: block;
  object-fit: contain;
  transition:
    transform 0.22s ease,
    filter 0.22s ease;
}
.hazumi-menu-text {
  color: #000000;
  font-family: "Modak", system-ui;
  font-size: 22px;
  font-weight: 400;
  line-height: 1;
  white-space: nowrap;
  transition:
    color 0.22s ease,
    transform 0.22s ease;
}
/* Hover */
.hazumi-menu-item:hover {
  background: linear-gradient(
    90deg,
    rgba(237, 243, 235, 0.95) 0%,
    rgba(235, 253, 231, 0.95) 100%
  );
  transform: translateX(3px);
  box-shadow: 0 8px 20px rgba(120, 220, 84, 0.12);
}
.hazumi-menu-item:hover::before {
  height: 30px;
}
.hazumi-menu-item:hover .hazumi-menu-icon {
  background: rgba(120, 220, 84, 0.16);
}
.hazumi-menu-item:hover .hazumi-menu-icon img {
  transform: scale(1.07) rotate(-3deg);
}
.hazumi-menu-item:hover .hazumi-menu-text {
  color: #35a918;
  transform: translateX(2px);
}
/* Active */
.hazumi-menu-item.active {
  background: linear-gradient(
    90deg,
    rgba(237, 243, 235, 1) 0%,
    rgba(235, 253, 231, 1) 100%
  );
  box-shadow:
    0 8px 20px rgba(120, 220, 84, 0.14),
    inset 0 1px 0 rgba(255, 255, 255, 0.75);
}
.hazumi-menu-item.active::before {
  height: 34px;
}
.hazumi-menu-item.active .hazumi-menu-icon {
  background: rgba(120, 220, 84, 0.18);
}
.hazumi-menu-item.active .hazumi-menu-text {
  color: #2ea714;
}
/* Click feeling */
.hazumi-menu-item:active {
  transform: translateX(3px) scale(0.985);
}    
        /* MAIN CONTENT */
        .main-container {
            min-width: 0;
            min-height: 0;
            height: 100dvh;
            flex: 1;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
        }
        /* HEADER & NAV */
        .calendar-header {
            min-height: 42px;
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .calendar-layout {
            min-width: 0;
            min-height: 0;
            flex: 1;
            display: flex;
            gap: 18px;
            overflow: hidden;
        }
        .calendar-title {
            font-family: 'Fredoka One', sans-serif;
            font-size: 28px;
            color: var(--text-dark);
        }
        .view-switcher {
            background: #EBF0F9;
            padding: 5px;
            border-radius: 12px;
            display: flex;
            gap: 5px;
        }
        .view-btn {
            border: none;
            background: transparent;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }
        .view-btn.active {
            background: white;
            color: var(--text-dark);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        /* CALENDAR CARD */
        .calendar-card {
            min-width: 0;
            min-height: 0;
            height: 100%;
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
        }
        .month-nav {
            min-height: 40px;
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .calendar-content-area {
            min-width: 0;
            min-height: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .month-name {
            font-size: 22px;
            font-weight: 800;
        }
        .nav-btn {
            background: #F1F3F9;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .nav-btn:hover {
            background: #E2E6F0;
        }
        /* GRID */
        .grid-header {
            min-height: 24px;
            flex: 0 0 auto;
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            align-items: center;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 800;
            text-align: center;
        }
        .grid-body {
            min-width: 0;
            min-height: 0;
            height: 100%;
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            grid-auto-rows: minmax(0, 1fr);
            gap: 8px;
            overflow: hidden;
        }
        .day-cell {
            position: relative;
            min-width: 0;
            min-height: 0;
            padding: 7px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden;
            cursor: pointer;
            background: #FAFBFC;
            border: 2px solid #F1F3F9;
            border-radius: 12px;
            transition: all 0.15s ease;
        }
        .day-cell:hover {
            border-color: var(--primary-color);
            background: #F7FCF5;
        }
        .day-cell.today {
            border-color: var(--primary-color);
            background: #F0FAF0;
        }
        .day-cell.today .day-number {
            background: var(--primary-color);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .day-cell.other-month {
            opacity: 0.4;
        }
        .day-number {
            font-weight: 800;
            font-size: 14px;
        }
        .task-count-wrap {
            margin-top: auto;
            padding-top: 10px;
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
        }
        .task-count-badge {
            min-width: 28px;
            height: 28px;
            padding: 0 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary-color), #86EA6D);
            border-radius: 999px;
            box-shadow:
                0 10px 20px rgba(108, 210, 89, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }
        .task-count-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.65);
            flex: 0 0 8px;
        }
        .task-count-number {
            display: inline-block;
            min-width: 8px;
        }
        .event-indicator {
            display: none;
        }
      /* TASK (iOS  Sidebar) */
        .task-panel {
            width: 300px;
            min-height: 0;
            height: 100%;
            flex: 0 0 300px;
            padding: 22px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
        }
        .task-panel-header {
            font-weight: 800;
            font-size: 18px;
            border-bottom: 2px solid #F1F3F9;
            padding-bottom: 15px;
        }
        .task-list {
            min-height: 0;
            flex: 1;
            padding-right: 3px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) #edf1eb;
        }
        .task-item {
            background: #F8FAF7;
            border-left: 4px solid var(--primary-color);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .task-info h4 {
            font-weight: 700;
            font-size: 14px;
        }
        .task-info span {
            font-size: 11px;
            color: var(--text-muted);
        }
        .delete-btn {
            background: none;
            border: none;
            color: #FF5A5A;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            padding: 5px;
            line-height: 1;
        }
        .add-task-form {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        .task-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #EAECEF;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }
        .task-input:focus {
            border-color: var(--primary-color);
        }
        .time-selects {
            display: flex;
            gap: 8px;
        }
        .add-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
        }
        .add-btn:hover {
            background: var(--primary-hover);
        }
        /* Short laptop screens */
        @media (max-height: 760px) {
            .main-container {
                padding: 12px;
                gap: 10px;
            }
            .hazumi-sidebar {
                height: calc(100dvh - 24px);
                margin-top: 12px;
                margin-bottom: 12px;
                padding: 16px 14px;
            }
            .hazumi-brand {
                height: 80px;
                flex-basis: 80px;
            }
            .hazumi-menu {
                margin-top: 10px;
                gap: 4px;
            }
            .hazumi-menu-item {
                height: 54px;
                min-height: 54px;
            }
            .calendar-card {
                padding: 14px;
            }
            .month-nav {
                margin-bottom: 7px;
            }
            .task-panel {
                padding: 16px 14px;
                gap: 10px;
            }
            .task-panel-header {
                padding-bottom: 10px;
            }
            .task-input {
                padding: 9px 10px;
            }
            .add-btn {
                padding: 10px;
            }
            .grid-body {
                gap: 6px;
            }
            .day-cell {
                padding: 5px;
                border-radius: 10px;
            }
        }
        @media (max-width: 1250px) and (min-width: 1025px) {
            .main-container {
                min-width: 900px;
            }
        }
        /* RESPONSIVE*/
        @media (max-width: 1024px) {
            html,
            body {
                width: 100%;
                min-width: 0;
                min-height: 100%;
                height: auto;
                overflow-x: hidden;
                overflow-y: auto;
                background:
                    radial-gradient(circle at 86% 4%, rgba(120, 220, 84, 0.22), transparent 26%),
                    radial-gradient(circle at 10% 22%, rgba(255, 233, 31, 0.13), transparent 28%),
                    var(--bg-color);
            }
            body {
                display: block;
                padding: 0;
            }
            .hazumi-sidebar {
                display: block !important;
                position: fixed;
                left: 12px;
                right: 12px;
                bottom: 12px;
                top: auto;
                z-index: 9999;
                width: auto;
                height: 76px;
                min-height: 0;
                margin: 0;
                padding: 8px;
                background: rgba(255, 255, 255, 0.9);
                border: 1px solid rgba(255, 255, 255, 0.95);
                border-radius: 28px;
                box-shadow:
                    0 18px 45px rgba(66, 92, 57, 0.18),
                    inset 0 1px 0 rgba(255, 255, 255, 0.9);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                overflow: hidden;
            }
            .hazumi-brand {
                display: none !important;
            }
            .hazumi-menu {
                width: 100%;
                height: 100%;
                margin: 0;
                display: grid;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 5px;
                overflow: visible;
            }
            .hazumi-menu-item:nth-child(6) {
                display: none !important;
            }
            .hazumi-menu-item {
                position: relative;
                width: auto;
                height: 60px;
                min-height: 0;
                padding: 6px 2px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 4px;
                color: #7b8278;
                text-decoration: none;
                border-radius: 22px;
                background: transparent;
                box-shadow: none;
                transform: none;
                transition:
                    background 0.18s ease,
                    color 0.18s ease,
                    transform 0.18s ease;
            }
            .hazumi-menu-item::before {
                display: none;
            }
            .hazumi-menu-icon {
                width: 28px;
                height: 28px;
                display: grid;
                place-items: center;
                border-radius: 12px;
                background: transparent;
            }
            .hazumi-menu-icon img {
                width: 25px;
                height: 25px;
                display: block;
                object-fit: contain;
            }
            .hazumi-menu-text {
                max-width: 100%;
                color: inherit;
                font-family: Arial, sans-serif;
                font-size: 10px;
                font-weight: 800;
                line-height: 1;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .hazumi-menu-item:hover {
                transform: none;
                box-shadow: none;
            }
            .hazumi-menu-item:active {
                transform: scale(0.94);
            }
            .hazumi-menu-item.active {
                color: #2ea714;
                background: linear-gradient(
                    180deg,
                    rgba(237, 243, 235, 1) 0%,
                    rgba(235, 253, 231, 1) 100%
                );
                box-shadow:
                    0 8px 20px rgba(120, 220, 84, 0.16),
                    inset 0 1px 0 rgba(255, 255, 255, 0.85);
            }

            .hazumi-menu-item.active .hazumi-menu-icon {
                background: rgba(120, 220, 84, 0.16);
            }
            .hazumi-menu-item.active .hazumi-menu-icon img {
                transform: scale(1.05);
            }
            .main-container {
                width: 100%;
                min-width: 0;
                min-height: 100dvh;
                height: auto;
                padding: 14px 14px 104px;
                display: flex;
                flex-direction: column;
                gap: 16px;
                overflow: visible;
            }
            .calendar-header {
                min-height: 0;
                display: flex;
                flex-direction: column;

            }
            .calendar-title {
                font-size: clamp(40px, 13vw, 56px);
                line-height: 0.95;
            }
            .view-switcher {
                width: 100%;
                display: grid;

                gap: 5px;
                padding: 5px;
                border-radius: 16px;
            }
            .view-btn {
                width: 100%;
                min-width: 0;
                padding: 10px 6px;
                font-size: 12px;
                border-radius: 12px;
            }
            .calendar-layout {
                width: 100%;
                min-width: 0;
                min-height: 0;
                flex: none;
                display: flex;
                flex-direction: column;
                gap: 16px;
                overflow: visible;
            }
            .calendar-card {
                width: 100%;
                min-width: 0;

            }

            }

            }

            }

            }

            }
            .grid-body {

            }

                padding: 7px;
                border-width: 1.5px;
                border-radius: 14px;

            }

            }
            .event-indicator {
                margin-top: 4px;

                line-height: 1.25;
            }
            .task-panel {
                width: 100%;
                min-width: 0;
                min-height: 0;
                height: auto;
                flex: none;
                padding: 18px 16px;
                display: flex;
                flex-direction: column;
                gap: 14px;
                border-radius: 30px;
                overflow: hidden;
            }
            .task-panel-header {
                padding-bottom: 13px;
                font-size: 18px;
            }
            .task-list {
                min-height: 180px;
                max-height: 360px;
                padding-right: 2px;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            .task-item {
                padding: 12px;
                border-radius: 13px;
            }

                font-size: 14px;

            }

            }

                width: 32px;

            }
            .delete-btn:active {
                color: #ffffff;
                background: #ff5a5a;
            }

                display: grid;
                grid-template-columns: 1fr;

            }

                min-width: 0;

                padding: 0 13px;
                border-radius: 14px;
            }
            .time-selects {
                display: grid;
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .add-btn {
                height: 46px;
                padding: 0 14px;
                border-radius: 14px;
                font-size: 14px;
            }
        }
        @media (max-width: 420px) {
            .task-count-wrap {
                padding-top: 6px;
            }
            .task-count-badge {
                min-width: 22px;
                height: 22px;
                padding: 0 8px;
                gap: 5px;
                font-size: 10px;
            }
            .task-count-dot {
                width: 6px;
                height: 6px;
                flex-basis: 6px;
